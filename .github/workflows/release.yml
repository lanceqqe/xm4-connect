# Builds and publishes a release whenever main carries a version that has no release yet.
# To release: bump CFBundleShortVersionString in Resources/Info.plist and push to main.
# The workflow creates the vX.Y.Z tag itself. Pushing a vX.Y.Z tag also works.
#
# Artifacts: XM-Connect-macos.zip (used by install.sh), XM-Connect-Installer.pkg, XM-Connect.dmg,
# each with a .sha256 file and a signed build-provenance attestation.
#
# Without secrets the app is signed ad hoc (users installing via install.sh see no warning;
# downloads from the browser need a one-time "Open Anyway"). To ship a release that macOS trusts
# with no warning at all, add these repository secrets (Settings › Secrets and variables › Actions):
#   MACOS_CERTIFICATE          base64 of a .p12 holding "Developer ID Application" and
#                              "Developer ID Installer" certificates
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   APPLE_ID                   Apple ID email of the developer account
#   APPLE_TEAM_ID              10-character Team ID
#   APPLE_APP_PASSWORD         app-specific password for notarization (appleid.apple.com)
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$VERSION"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; nothing to do"
          fi

      - name: Protocol tests
        if: steps.version.outputs.release == 'true'
        run: make test

      - name: Import Developer ID certificates
        if: steps.version.outputs.release == 'true' && env.HAS_SIGNING == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12
          APP_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          INST_ID=$(security find-identity -v build.keychain | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.+)"/\1/')
          echo "SIGN_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"

      - name: Build app, zip, installer and disk image
        if: steps.version.outputs.release == 'true'
        run: |
          make zip pkg dmg SIGN_IDENTITY="${SIGN_IDENTITY:--}" INSTALLER_IDENTITY="${INSTALLER_IDENTITY:-}"

      - name: Notarize and staple
        if: steps.version.outputs.release == 'true' && env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for f in "build/XM Connect Installer.pkg" "build/XM Connect.dmg"; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$f"
          done
          # The zip cannot be stapled: notarize the app, staple the app, then re-zip it.
          xcrun notarytool submit build/XM-Connect-macos.zip --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/XM Connect.app"
          rm build/XM-Connect-macos.zip
          (cd build && ditto -c -k --keepParent --sequesterRsrc "XM Connect.app" XM-Connect-macos.zip)

      - name: Checksums
        if: steps.version.outputs.release == 'true'
        run: |
          cd build
          mkdir -p release
          cp XM-Connect-macos.zip release/
          cp "XM Connect Installer.pkg" release/XM-Connect-Installer.pkg
          cp "XM Connect.dmg" release/XM-Connect.dmg
          cd release
          for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
          cat *.sha256

      - uses: actions/attest-build-provenance@v2
        if: steps.version.outputs.release == 'true'
        with:
          subject-path: |
            build/release/XM-Connect-macos.zip
            build/release/XM-Connect-Installer.pkg
            build/release/XM-Connect.dmg

      # One-off cleanup: v1.1.0 was built from history that was later rewritten.
      - name: Remove superseded v1.1.0 release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.1.0 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: XM Connect ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/release/*
